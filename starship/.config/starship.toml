"$schema" = 'https://starship.rs/config-schema.json'

# Prompt de dos lineas:
#   linea 1 -> ruta completa + git + duracion del comando
#   linea 2 -> el simbolo donde escribes
# Asi la ruta nunca compite por espacio con lo que tecleas, por larga que sea.

format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

palette = 'catppuccin_mocha'
add_newline = true

# ---------------------------------------------------------------------------
# Ruta
# ---------------------------------------------------------------------------
[directory]
format = '[$path]($style)[$read_only]($read_only_style) '
style = 'bold lavender'
# 0 = sin truncar. Muestra la ruta entera, que es lo que querias.
truncation_length = 0
# false = ruta desde la raiz aunque estes dentro de un repo git
truncate_to_repo = false
read_only = ' '
read_only_style = 'red'
home_symbol = '~'

# ---------------------------------------------------------------------------
# Git
# ---------------------------------------------------------------------------
[git_branch]
symbol = ' '
format = 'on [$symbol$branch]($style) '
style = 'bold mauve'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = 'bold peach'
conflicted = '=${count} '
ahead = '⇡${count} '
behind = '⇣${count} '
diverged = '⇕⇡${ahead_count}⇣${behind_count} '
untracked = '?${count} '
stashed = '≡${count} '
modified = '!${count} '
staged = '+${count} '
renamed = '»${count} '
deleted = '✘${count} '

# ---------------------------------------------------------------------------
# Duracion del comando (lo que ya tenias en el prompt viejo)
# ---------------------------------------------------------------------------
[cmd_duration]
min_time = 500
format = 'took [$duration]($style) '
style = 'bold yellow'

# ---------------------------------------------------------------------------
# El simbolo
# ---------------------------------------------------------------------------
[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold lavender)'

# ---------------------------------------------------------------------------
# Paleta Catppuccin Mocha, la misma de Alacritty, Spicetify y fastfetch
# ---------------------------------------------------------------------------
[palettes.catppuccin_mocha]
rosewater = '#f5e0dc'
flamingo = '#f2cdcd'
pink = '#f5c2e7'
mauve = '#cba6f7'
red = '#f38ba8'
maroon = '#eba0ac'
peach = '#fab387'
yellow = '#f9e2af'
green = '#a6e3a1'
teal = '#94e2d5'
sky = '#89dceb'
sapphire = '#74c7ec'
blue = '#89b4fa'
lavender = '#b4befe'
text = '#cdd6f4'
subtext1 = '#bac2de'
subtext0 = '#a6adc8'
overlay2 = '#9399b2'
overlay1 = '#7f849c'
overlay0 = '#6c7086'
surface2 = '#585b70'
surface1 = '#45475a'
surface0 = '#313244'
base = '#1e1e2e'
mantle = '#181825'
crust = '#11111b'
