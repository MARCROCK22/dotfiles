# Alacritty — CachyOS + Niri
# Paleta Catppuccin Mocha ajustada para transparencia.

[general]
# Se quitó el import de ~/.config/alacritty/themes/noctalia.toml:
# era un resto de Noctalia y el archivo ya no existe.
working_directory = "None"
live_config_reload = true

[env]
TERM = "xterm-256color"
WINIT_X11_SCALE_FACTOR = "1.0"

[window]
dimensions = { columns = 100, lines = 30 }
dynamic_padding = true
decorations = "Full"
opacity = 0.8
title = "Alacritty@CachyOS"
class = { instance = "Alacritty", general = "Alacritty" }
decorations_theme_variant = "Dark"

[scrolling]
history = 10000
multiplier = 3

[font]
# Antes era "monospace", un alias genérico que fontconfig resolvía a
# DejaVu Sans Mono: sin iconos Nerd Font y con peor renderizado.
#
# Se usa la variante "Mono" a propósito: fuerza los iconos a ocupar una sola
# celda. Con la variante normal los glifos tienen ancho variable y descuadran
# las columnas alineadas del recuadro de fastfetch.
normal = { family = "JetBrainsMono Nerd Font Mono", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font Mono", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font Mono", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font Mono", style = "Bold Italic" }
size = 12.0

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = { shape = "Underline", blinking = "Off" }
unfocused_hollow = true
thickness = 0.15

[mouse]
hide_when_typing = true
bindings = [
  { mouse = "Middle", mods = "None", action = "PasteSelection" },
]

[keyboard]
bindings = [
  { key = "Paste", mods = "None", action = "Paste" },
  { key = "Copy", mods = "None", action = "Copy" },
  { key = "L", mods = "Control", action = "ClearLogNotice" },
  { key = "L", mods = "Control", mode = "~Vi", chars = "\f" },
  { key = "PageUp", mods = "Shift", mode = "~Alt", action = "ScrollPageUp" },
  { key = "PageDown", mods = "Shift", mode = "~Alt", action = "ScrollPageDown" },
  { key = "Home", mods = "Shift", mode = "~Alt", action = "ScrollToTop" },
  { key = "End", mods = "Shift", mode = "~Alt", action = "ScrollToBottom" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "F", mods = "Control|Shift", action = "SearchForward" },
  { key = "B", mods = "Control|Shift", action = "SearchBackward" },
  { key = "C", mods = "Control|Shift", mode = "Vi", action = "ClearSelection" },
  { key = "Key0", mods = "Control", action = "ResetFontSize" },
]

# ---------------------------------------------------------------------------
# Colores
# ---------------------------------------------------------------------------

[colors]
draw_bold_text_with_bright_colors = true

[colors.primary]
# Fondo más oscuro que el #1e1e2e original: con opacity 0.8 se mezcla con el
# wallpaper y se aclara, así que hay que compensar para no perder contraste.
background = "#181825"
foreground = "#e4e8f5"
dim_foreground = "#9aa0b5"
bright_foreground = "#ffffff"

[colors.cursor]
text = "#181825"
cursor = "#b4befe"

[colors.selection]
# Selección oscura con texto claro, en vez de un bloque casi blanco.
text = "#e4e8f5"
background = "#45475a"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
# El mapeo oficial de Catppuccin repite aquí los mismos valores que en
# [colors.normal], por lo que la negrita no se distinguía. Estos son
# versiones aclaradas para que sí lo haga.
black = "#6c7086"
red = "#f7a3bb"
green = "#b9eab5"
yellow = "#fbebc6"
blue = "#a3c5fb"
magenta = "#f8d3ee"
cyan = "#ade9df"
white = "#ffffff"
