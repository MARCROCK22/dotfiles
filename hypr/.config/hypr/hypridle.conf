$lock_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lock")' & pidof qs quickshell hyprlock || hyprlock
# $lock_cmd = pidof hyprlock || hyprlock
$suspend_cmd = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock_cmd
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.global("quickshell:lockFocus")'; ~/.local/bin/reparar-pantallas
    inhibit_sleep = 3
}

listener {
    timeout = 300 # 5mins
    on-timeout = loginctl lock-session
}

listener {
    timeout = 600 # 10mins
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    # El DisplayPort vuelve a veces sin EDID y Hyprland lo deja en 640x480.
    # reparar-pantallas lo detecta y renegocia el enlace. Si vino bien no hace
    # nada, por eso va siempre y no solo cuando falla. La ruta va con ~ y no
    # con $HOME: el $ es el sigilo de variables de hyprlang, no del shell.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; ~/.local/bin/reparar-pantallas
}

listener {
    timeout = 900 # 15mins
    on-timeout = $suspend_cmd
}
