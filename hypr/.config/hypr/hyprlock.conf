$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

input-field {
    monitor =
    size = 300, 55
    outline_thickness = 3
    inner_color = rgba(26, 26, 32, 0.7)
    outer_color = rgba(184, 164, 227, 1.0)
    check_color = rgba(184, 164, 227, 1.0)
    fail_color = rgba(227, 92, 92, 1.0)
    font_color = rgb(230, 230, 235)
    fade_on_empty = false
    rounding = 24
    font_family = $font
    placeholder_text = Contraseña
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    font_size = 90
    font_family = $font
    color = rgba(230, 230, 235, 1.0)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B"
    font_size = 20
    font_family = $font
    color = rgba(184, 164, 227, 0.9)
    position = 0, 50
    halign = center
    valign = center
}
